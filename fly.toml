# fly.toml app configuration file for startup-next
# Despliegue MANUAL (flyctl deploy) -- no hay integración Git↔Fly conectada.
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'startup-next'
primary_region = 'cdg'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '5s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
